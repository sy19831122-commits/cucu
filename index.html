<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 10 단어장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 가독성을 높이기 위한 선명한 텍스트 스타일 */
        .word-text {
            color: #1a1a1a;
            font-weight: 900;
            line-height: 1.2;
        }

        .meaning-text {
            color: #2563eb;
            font-weight: 700;
        }

        /* 카드 플립 애니메이션 */
        .card-container {
            perspective: 1000px;
            height: 350px;
            width: 100%;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            background: white;
            padding: 20px;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #f8fafc;
        }

        /* 버튼 및 인터페이스 */
        .btn-primary {
            background-color: #2563eb;
            color: white;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .choice-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background-color: #f3f4f6;
        }

        .choice-btn.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .choice-btn.wrong {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .letter-tile {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.2rem;
            background: white;
            cursor: pointer;
        }

        .letter-tile.used {
            opacity: 0.3;
            pointer-events: none;
        }

        .answer-slot {
            width: 35px;
            height: 45px;
            border-bottom: 3px solid #3b82f6;
            margin: 0 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #1e40af;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 상단 탭 -->
    <div class="flex border-b">
        <button onclick="changeMode('study')" id="tab-study" class="flex-1 py-4 font-bold text-blue-600 border-b-2 border-blue-600">학습하기</button>
        <button onclick="changeMode('choice')" id="tab-choice" class="flex-1 py-4 font-bold text-gray-500">뜻 선택</button>
        <button onclick="changeMode('spelling')" id="tab-spelling" class="flex-1 py-4 font-bold text-gray-500">스펠링</button>
    </div>

    <!-- 진행률 -->
    <div class="px-6 pt-6">
        <div class="flex justify-between text-sm font-bold text-gray-500 mb-2">
            <span id="progress-text">1 / 40</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2.5">
            <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
    </div>

    <!-- 콘텐츠 영역 -->
    <div class="flex-1 p-6 flex flex-col justify-center">
        
        <!-- 1. 학습하기 모드 -->
        <div id="mode-study" class="mode-content">
            <div class="card-container" onclick="toggleFlip()">
                <div id="flashcard" class="card-inner">
                    <div class="card-front">
                        <span id="study-pos" class="text-blue-500 font-bold mb-2"></span>
                        <h2 id="study-word" class="word-text text-5xl mb-4"></h2>
                        <p id="study-pron" class="text-gray-400 text-xl italic"></p>
                        <p class="mt-8 text-sm text-gray-300 font-bold">카드를 터치하면 뜻이 보여요!</p>
                    </div>
                    <div class="card-back">
                        <h3 id="study-meaning" class="meaning-text text-4xl mb-6"></h3>
                        <div class="text-left w-full space-y-2">
                            <p class="text-gray-600 font-semibold text-center italic" id="study-phrase"></p>
                            <hr class="my-4">
                            <p class="text-sm text-gray-500" id="study-def"></p>
                            <p class="text-xs text-gray-400" id="study-def-kor"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="prevWord()" class="flex-1 py-4 bg-gray-100 rounded-xl font-bold text-gray-600">이전</button>
                <button onclick="nextWord()" class="flex-1 py-4 btn-primary rounded-xl font-bold">다음 단어</button>
            </div>
        </div>

        <!-- 2. 뜻 선택 퀴즈 -->
        <div id="mode-choice" class="mode-content hidden">
            <div class="text-center mb-8">
                <h2 id="choice-word" class="word-text text-5xl mb-2"></h2>
                <p id="choice-pron" class="text-gray-400 text-lg"></p>
            </div>
            <div id="choice-options" class="flex flex-col">
                <!-- 선택지 버튼이 여기에 생성됨 -->
            </div>
        </div>

        <!-- 3. 스펠링 퀴즈 -->
        <div id="mode-spelling" class="mode-content hidden">
            <div class="text-center mb-6">
                <h2 id="spelling-meaning" class="meaning-text text-3xl mb-4"></h2>
                <div id="spelling-slots" class="flex justify-center flex-wrap mb-8"></div>
            </div>
            <div id="spelling-pool" class="flex flex-wrap justify-center gap-2 mb-8"></div>
            <div class="flex gap-2">
                <button onclick="resetSpelling()" class="flex-1 py-3 bg-gray-100 rounded-lg font-bold text-gray-500">지우기</button>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="mode-result" class="mode-content hidden text-center">
            <div class="text-7xl mb-6">🎉</div>
            <h2 class="text-3xl font-black mb-4">학습 완료!</h2>
            <p class="text-gray-500 mb-8">Lesson 10의 모든 단어를 마스터했습니다.</p>
            <button onclick="location.reload()" class="w-full py-4 btn-primary rounded-xl font-bold">다시 학습하기</button>
        </div>
    </div>
</div>

<script>
    const words = [
        { word: "identify", pron: "아이덴티파이", pos: "v", meaning: "식별하다", phrase: "identify the criminal", def: "to find out who someone is or what something is", defKor: "누군가 또는 무언가가 누구인지 알아내다" },
        { word: "interact", pron: "인터랙트", pos: "v", meaning: "소통하다", phrase: "interact with the audience", def: "to talk or do things with other people", defKor: "다른 사람들과 소통하거나 활동하다" },
        { word: "comparison", pron: "컴패리슨", pos: "n", meaning: "비교", phrase: "price comparison", def: "the process of comparing two or more things", defKor: "두 가지 이상의 사물을 비교하는 과정" },
        { word: "origin", pron: "오리진", pos: "n", meaning: "기원", phrase: "origin of life", def: "the point or place where something begins", defKor: "무언가가 시작되는 지점이나 장소" },
        { word: "unexpected", pron: "언익스펙티드", pos: "a", meaning: "뜻밖의", phrase: "unexpected question", def: "not expected", defKor: "예상하지 못한" },
        { word: "remedy", pron: "레머디", pos: "n", meaning: "요법", phrase: "home remedy", def: "a treatment to cure or reduce pain", defKor: "통증을 줄이거나 치료하는 방법" },
        { word: "violate", pron: "바이얼레이트", pos: "v", meaning: "침해하다", phrase: "violate privacy", def: "to interfere with someone's rights", defKor: "타인의 권리를 침해하다" },
        { word: "hygiene", pron: "하이지인", pos: "n", meaning: "위생", phrase: "personal hygiene", def: "keeping yourself clean to prevent disease", defKor: "질병 예방을 위해 몸을 깨끗이 하는 것" },
        { word: "chaos", pron: "케이오스", pos: "n", meaning: "혼돈", phrase: "total chaos", def: "a state of complete confusion", defKor: "완전한 혼란 상태" },
        { word: "ritual", pron: "리추얼", pos: "n", meaning: "의식", phrase: "religious ritual", def: "a formal ceremony", defKor: "격식을 갖춘 의식" },
        { word: "illuminate", pron: "일루미네이트", pos: "v", meaning: "비추다", phrase: "illuminate dark streets", def: "to shine light on something", defKor: "무언가에 빛을 비추다" },
        { word: "convert", pron: "컨버트", pos: "v", meaning: "전환하다", phrase: "convert sunlight into energy", def: "to change something from one form to another", defKor: "무언가를 다른 형태로 바꾸다" },
        { word: "descent", pron: "디센트", pos: "n", meaning: "혈통", phrase: "royal descent", def: "the family or race you come from", defKor: "가족이나 인종의 계통" },
        { word: "alternative", pron: "얼터너티브", pos: "n", meaning: "대안", phrase: "realistic alternative", def: "something you can choose instead", defKor: "대신 선택할 수 있는 것" },
        { word: "vaccination", pron: "백시네이션", pos: "n", meaning: "예방접종", phrase: "flu vaccination", def: "giving a vaccine to protect against disease", defKor: "질병 예방을 위한 백신 투여" },
        { word: "divine", pron: "디바인", pos: "a", meaning: "신의", phrase: "divine will", def: "relating to God", defKor: "신과 관련된" },
        { word: "exposure", pron: "익스포저", pos: "n", meaning: "노출", phrase: "exposure to cold", def: "being exposed to something", defKor: "무언가에 노출된 상태" },
        { word: "ambient", pron: "앰비언트", pos: "a", meaning: "주변의", phrase: "ambient noise", def: "existing or present around you", defKor: "주변에 존재하는" },
        { word: "catchy", pron: "캐치", pos: "a", meaning: "기억하기 쉬운", phrase: "catchy melody", def: "pleasing and easily remembered", defKor: "즐겁고 기억하기 쉬운" },
        { word: "immigrant", pron: "이미그런트", pos: "n", meaning: "이민자", phrase: "illegal immigrant", def: "a person who moves to another country", defKor: "타국으로 이주한 사람" },
        { word: "notable", pron: "노터블", pos: "a", meaning: "주목할 만한", phrase: "notable achievement", def: "worth noticing", defKor: "주목할 가치가 있는" },
        { word: "moving", pron: "무빙", pos: "a", meaning: "감동적인", phrase: "moving story", def: "causing deep feelings of sympathy", defKor: "깊은 감동을 주는" },
        { word: "embrace", pron: "임브레이스", pos: "v", meaning: "받아들이다", phrase: "embrace new ideas", def: "to accept something with interest", defKor: "무언가를 기꺼이 받아들이다" },
        { word: "retain", pron: "리테인", pos: "v", meaning: "유지하다", phrase: "retain control", def: "to keep something", defKor: "무언가를 보유/유지하다" },
        { word: "organ", pron: "오건", pos: "n", meaning: "장기", phrase: "organ transplant", def: "a part of the body with a purpose", defKor: "특정 기능을 하는 신체 부위" },
        { word: "vandalism", pron: "밴덜리즘", pos: "n", meaning: "기물 파손", phrase: "act of vandalism", def: "damaging property intentionally", defKor: "재산을 고의로 파손하는 행위" },
        { word: "segregation", pron: "세그리게이션", pos: "n", meaning: "분리", phrase: "racial segregation", def: "separating people by race/religion", defKor: "인종/종교 등에 따른 분리" },
        { word: "deter", pron: "디터", pos: "v", meaning: "막다", phrase: "deter crime", def: "to prevent someone from doing something", defKor: "행동을 못 하도록 막다" },
        { word: "statistics", pron: "스터티스틱스", pos: "n", meaning: "통계", phrase: "official statistics", def: "info shown in numbers", defKor: "수치로 표현된 정보" },
        { word: "dense", pron: "덴스", pos: "a", meaning: "밀집한", phrase: "dense fog", def: "thick or heavy", defKor: "빽빽하거나 짙은" },
        { word: "overstate", pron: "오버스테이트", pos: "v", meaning: "과장하다", phrase: "overstate the risk", def: "to make something seem more important", defKor: "실제보다 크게 말하다" },
        { word: "uncover", pron: "언커버", pos: "v", meaning: "밝혀내다", phrase: "uncover the truth", def: "to find out something secret", defKor: "비밀을 알아내다" },
        { word: "absence", pron: "앱선스", pos: "n", meaning: "부재", phrase: "absence of light", def: "something not existing", defKor: "존재하지 않는 상태" },
        { word: "recurring", pron: "리커링", pos: "a", meaning: "반복되는", phrase: "recurring theme", def: "happening again and again", defKor: "다시 발생하는" },
        { word: "emit", pron: "이미트", pos: "v", meaning: "내뿜다", phrase: "emit light", def: "to send out light or gas", defKor: "빛이나 가스 등을 내보내다" },
        { word: "detect", pron: "디텍트", pos: "v", meaning: "탐지하다", phrase: "detect a leak", def: "to notice or discover", defKor: "알아차리거나 발견하다" },
        { word: "sanitation", pron: "새니테이션", pos: "n", meaning: "위생설비", phrase: "modern sanitation", def: "waste removal systems", defKor: "폐기물 처리 시스템" },
        { word: "healthcare", pron: "헬스케어", pos: "n", meaning: "의료", phrase: "healthcare system", def: "services for health", defKor: "건강 관리 서비스" },
        { word: "unauthorized", pron: "언오서라이즈드", pos: "a", meaning: "무허가의", phrase: "unauthorized access", def: "without official permission", defKor: "공식 허가 없는" },
        { word: "adequate", pron: "애디퀴트", pos: "a", meaning: "충분한", phrase: "adequate resources", def: "enough in quantity", defKor: "양이 충분한" }
    ];

    let currentIndex = 0;
    let currentMode = 'study';
    let quizData = [];
    let currentAnswer = "";

    function changeMode(mode) {
        currentMode = mode;
        // 탭 스타일 변경
        document.querySelectorAll('button[id^="tab-"]').forEach(btn => {
            btn.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            btn.classList.add('text-gray-500');
        });
        document.getElementById(`tab-${mode}`).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
        document.getElementById(`tab-${mode}`).classList.remove('text-gray-500');

        // 콘텐츠 표시
        document.querySelectorAll('.mode-content').forEach(content => content.classList.add('hidden'));
        document.getElementById(`mode-${mode}`).classList.remove('hidden');

        // 모드별 초기화
        currentIndex = 0;
        if (mode === 'study') initStudy();
        else if (mode === 'choice') initChoice();
        else if (mode === 'spelling') initSpelling();
    }

    function updateProgress() {
        const total = words.length;
        const current = currentIndex + 1;
        const percent = (current / total) * 100;
        document.getElementById('progress-text').innerText = `${current} / ${total}`;
        document.getElementById('progress-percent').innerText = `${Math.round(percent)}%`;
        document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    /* --- 학습하기 로직 --- */
    function initStudy() {
        const word = words[currentIndex];
        document.getElementById('flashcard').classList.remove('is-flipped');
        document.getElementById('study-word').innerText = word.word;
        document.getElementById('study-pron').innerText = `[${word.pron}]`;
        document.getElementById('study-pos').innerText = word.pos.toUpperCase();
        document.getElementById('study-meaning').innerText = word.meaning;
        document.getElementById('study-phrase').innerText = `"${word.phrase}"`;
        document.getElementById('study-def').innerText = word.def;
        document.getElementById('study-def-kor').innerText = `(${word.defKor})`;
        updateProgress();
    }

    function toggleFlip() {
        document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    function nextWord() {
        if (currentIndex < words.length - 1) {
            currentIndex++;
            initStudy();
        } else {
            showResult();
        }
    }

    function prevWord() {
        if (currentIndex > 0) {
            currentIndex--;
            initStudy();
        }
    }

    /* --- 뜻 선택 로직 --- */
    function initChoice() {
        updateProgress();
        const word = words[currentIndex];
        document.getElementById('choice-word').innerText = word.word;
        document.getElementById('choice-pron').innerText = `[${word.pron}]`;
        
        const optionsContainer = document.getElementById('choice-options');
        optionsContainer.innerHTML = '';

        let choices = [word.meaning];
        while (choices.length < 4) {
            let randomMeaning = words[Math.floor(Math.random() * words.length)].meaning;
            if (!choices.includes(randomMeaning)) choices.push(randomMeaning);
        }
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = "choice-btn";
            btn.innerText = choice;
            btn.onclick = () => {
                if (choice === word.meaning) {
                    btn.classList.add('correct');
                    setTimeout(() => {
                        if (currentIndex < words.length - 1) {
                            currentIndex++;
                            initChoice();
                        } else showResult();
                    }, 600);
                } else {
                    btn.classList.add('wrong');
                }
            };
            optionsContainer.appendChild(btn);
        });
    }

    /* --- 스펠링 로직 --- */
    let spellingTyped = "";
    function initSpelling() {
        updateProgress();
        const word = words[currentIndex];
        spellingTyped = "";
        document.getElementById('spelling-meaning').innerText = word.meaning;
        
        const slots = document.getElementById('spelling-slots');
        slots.innerHTML = '';
        for (let i = 0; i < word.word.length; i++) {
            const div = document.createElement('div');
            div.className = "answer-slot";
            slots.appendChild(div);
        }

        const pool = document.getElementById('spelling-pool');
        pool.innerHTML = '';
        const letters = word.word.split('').sort(() => Math.random() - 0.5);
        letters.forEach((char, idx) => {
            const tile = document.createElement('div');
            tile.className = "letter-tile shadow-sm";
            tile.innerText = char;
            tile.onclick = () => {
                if (tile.classList.contains('used')) return;
                tile.classList.add('used');
                const nextSlot = slots.children[spellingTyped.length];
                nextSlot.innerText = char;
                spellingTyped += char;

                if (spellingTyped === word.word) {
                    setTimeout(() => {
                        if (currentIndex < words.length - 1) {
                            currentIndex++;
                            initSpelling();
                        } else showResult();
                    }, 600);
                } else if (spellingTyped.length === word.word.length) {
                    setTimeout(resetSpelling, 600);
                }
            };
            pool.appendChild(tile);
        });
    }

    function resetSpelling() {
        spellingTyped = "";
        const slots = document.getElementById('spelling-slots');
        Array.from(slots.children).forEach(s => s.innerText = "");
        const pool = document.getElementById('spelling-pool');
        Array.from(pool.children).forEach(t => t.classList.remove('used'));
    }

    function showResult() {
        document.querySelectorAll('.mode-content').forEach(c => c.classList.add('hidden'));
        document.getElementById('mode-result').classList.remove('hidden');
    }

    // 초기 실행
    window.onload = initStudy;
</script>

</body>
</html>
