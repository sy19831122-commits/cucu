<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 10 완전 학습 단어장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard:wght@400;600;700&display=swap');
        
        :root {
            --primary-pastel: #FFDEE9;
            --secondary-pastel: #B5FFFC;
            --study-bg: #fff5f8;
            --quiz-bg: #f0f7ff;
            --choice-bg: #f5fff0;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, var(--primary-pastel) 0%, var(--secondary-pastel) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
            touch-action: manipulation;
        }

        .cute-title {
            font-family: 'Gaegu', cursive;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        /* Bubble Style Containers */
        .bubble-container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            border: 6px solid white;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            position: relative;
        }

        /* Card Design */
        .word-card { perspective: 1000px; margin-bottom: 2rem; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 300px;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .card-front { background-color: white; color: #ff7eb9; border: 4px solid #fff0f3; }
        .card-back { background-color: #74ebd5; color: white; transform: rotateY(180deg); border: 4px solid #e0fcf8; }
        
        /* Interactive Buttons */
        .nav-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-bottom: 4px solid rgba(0,0,0,0.1);
        }
        .nav-btn:active { transform: scale(0.95) translateY(2px); border-bottom-width: 0; }
        
        .letter-tile {
            display: inline-flex; align-items: center; justify-content: center;
            width: 42px; height: 46px; background: white; border: 3px solid #ffd1dc;
            border-radius: 12px; font-weight: bold; font-size: 1.25rem;
            cursor: pointer; user-select: none; transition: all 0.1s;
            color: #ff8fab;
        }
        .letter-tile:active { transform: translateY(4px); background-color: #fff0f3; }
        .letter-tile.used { opacity: 0.2; pointer-events: none; }

        .answer-slot {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 42px; border-bottom: 4px solid #ffd1dc; margin: 0 3px;
            font-weight: 800; font-size: 1.4rem; color: #ff7495;
        }
        
        /* Choice Buttons */
        .choice-btn {
            width: 100%; text-align: center; padding: 1rem; border-radius: 1.5rem;
            border: 3px solid white; background: rgba(255,255,255,0.9); 
            font-weight: 700; color: #5c7cfa;
            transition: all 0.2s; box-shadow: 0 4px 0px rgba(0,0,0,0.04);
        }
        .choice-btn:hover { background: white; transform: translateY(-2px); box-shadow: 0 6px 0px rgba(0,0,0,0.04); }
        .choice-btn.correct { background-color: #d3f9d8; border-color: #51cf66; color: #2b8a3e; }
        .choice-btn.wrong { background-color: #fff0f0; border-color: #ff8787; color: #c92a2a; }

        /* Progress Bar */
        .progress-candy {
            height: 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.6);
            overflow: hidden;
            border: 2px solid white;
        }

        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        
        .pop-in { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop-in { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="app" class="w-full max-w-md">
        <!-- Header -->
        <header class="mb-6 text-center">
            <h1 class="text-4xl font-bold text-white cute-title tracking-tight mb-4">Word Candy 🍬</h1>
            <div class="flex flex-wrap justify-center gap-2 p-1 bg-white/40 rounded-3xl backdrop-blur-sm shadow-inner">
                <button onclick="showMode('study')" id="btn-study" class="nav-btn flex-1 px-3 py-2.5 rounded-2xl bg-white text-pink-500 font-bold text-sm shadow-sm">🍿 학습</button>
                <button onclick="showMode('quiz')" id="btn-quiz" class="nav-btn flex-1 px-3 py-2.5 rounded-2xl text-pink-600 font-bold text-sm">🎨 스펠링</button>
                <button onclick="showMode('choice')" id="btn-choice" class="nav-btn flex-1 px-3 py-2.5 rounded-2xl text-pink-600 font-bold text-sm">🍭 선택</button>
            </div>
        </header>

        <!-- Main Container -->
        <div class="bubble-container">
            <!-- Progress Section -->
            <div id="progress-container" class="mb-6">
                <div class="flex justify-between items-center text-xs text-pink-600 font-black mb-1.5 px-1">
                    <span id="progress-text">1 / 40</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-candy">
                    <div id="progress-bar" class="bg-gradient-to-r from-pink-300 to-pink-500 h-full transition-all duration-500 shadow-inner" style="width: 0%"></div>
                </div>
            </div>

            <!-- Study Mode Content -->
            <div id="study-mode" class="space-y-6">
                <div class="word-card" onclick="flipCard()">
                    <div id="main-card" class="card-inner">
                        <div class="card-front">
                            <span id="card-pos" class="bg-pink-50 text-pink-500 px-3 py-0.5 rounded-full text-[10px] font-black mb-3 border border-pink-100"></span>
                            <h2 id="card-word" class="text-4xl font-black tracking-tight mb-1"></h2>
                            <span id="card-pron" class="text-pink-300 font-bold text-lg mb-4"></span>
                            <div class="bg-pink-50/50 px-4 py-2 rounded-2xl border border-pink-100">
                                <p id="card-phrase" class="text-pink-400 italic text-sm font-medium"></p>
                            </div>
                            <p class="mt-6 text-[10px] text-pink-200 font-bold animate-pulse">탭해서 뜻 확인하기! ✨</p>
                        </div>
                        <div class="card-back">
                            <h3 id="card-meaning" class="text-3xl font-black mb-3"></h3>
                            <div class="w-12 h-1 bg-white/50 rounded-full mb-4"></div>
                            <p id="card-def" class="text-sm font-bold mb-1 leading-tight px-4"></p>
                            <p id="card-def-kor" class="text-[10px] opacity-90 leading-tight px-4 font-medium italic"></p>
                            <div id="card-syn" class="mt-5 text-[10px] font-black bg-black/5 px-4 py-1.5 rounded-full border border-white/20"></div>
                        </div>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="prevWord()" class="nav-btn flex-1 py-3.5 rounded-2xl bg-white/60 text-pink-400 font-black hover:bg-white transition text-sm">이전</button>
                    <button onclick="nextWord()" class="nav-btn flex-[2] py-3.5 rounded-2xl bg-pink-500 text-white font-black shadow-lg hover:bg-pink-600 transition text-sm">다음 단어 ✨</button>
                </div>
            </div>

            <!-- Spelling Quiz Content -->
            <div id="quiz-mode" class="hidden">
                <div id="quiz-ui" class="flex flex-col items-center justify-center min-h-[320px]">
                    <!-- Correct Overlay -->
                    <div id="correct-overlay" class="hidden absolute inset-0 bg-white/95 z-20 flex flex-col items-center justify-center pop-in px-8 text-center rounded-[2.5rem]">
                        <div class="text-4xl mb-4 animate-bounce">⭐</div>
                        <div id="reveal-word" class="text-3xl font-black text-pink-500 tracking-tight mb-1"></div>
                        <div id="reveal-meaning" class="text-lg font-black text-slate-700 mb-3 bg-pink-50 px-4 py-1 rounded-full"></div>
                        <p id="reveal-def" class="text-xs text-slate-500 font-bold mb-1"></p>
                        <p id="reveal-def-kor" class="text-[10px] text-slate-400 italic"></p>
                    </div>

                    <div class="text-center mb-6">
                        <h2 id="quiz-question" class="text-3xl font-black text-slate-800 mb-2"></h2>
                        <span class="px-3 py-0.5 bg-blue-50 text-blue-400 text-[10px] font-black rounded-full border border-blue-100 uppercase tracking-widest">Type it!</span>
                    </div>
                    
                    <div id="answer-display" class="flex flex-wrap justify-center mb-8 min-h-[42px]"></div>
                    <div id="letter-pool" class="flex flex-wrap justify-center gap-2 mb-6"></div>
                    
                    <div class="flex justify-center gap-2 w-full">
                        <button onclick="backspace()" class="flex-1 py-3 bg-white border-2 border-pink-50 text-pink-400 rounded-2xl text-xs font-black shadow-sm">지우기</button>
                        <button onclick="clearCurrentAnswer()" class="flex-1 py-3 bg-pink-50 text-pink-500 rounded-2xl text-xs font-black shadow-sm">전체삭제</button>
                    </div>
                    <div id="quiz-feedback" class="mt-4 text-center font-black text-[11px] h-4"></div>
                </div>
            </div>

            <!-- Choice Quiz Content -->
            <div id="choice-mode" class="hidden">
                <div id="choice-ui" class="flex flex-col items-center min-h-[320px]">
                    <div class="text-center mb-6">
                        <span class="text-[10px] font-black text-green-500 bg-green-50 px-3 py-1 rounded-full border border-green-100 uppercase tracking-widest">Pick one!</span>
                        <h2 id="choice-question-word" class="text-4xl font-black text-slate-800 mt-3 mb-1 tracking-tight"></h2>
                        <p id="choice-question-pron" class="text-slate-300 font-bold text-sm italic"></p>
                    </div>
                    <div id="choices-grid" class="grid grid-cols-1 gap-3 w-full mb-4"></div>
                    <div id="choice-feedback" class="text-center font-black text-[11px] h-4 transition-all"></div>
                </div>
            </div>

            <!-- Final Result Content -->
            <div id="result-view" class="hidden text-center py-6">
                <div class="text-6xl mb-4 animate-bounce">👑</div>
                <h2 class="text-3xl font-black text-slate-800 mb-3 cute-title">Great Job!</h2>
                <p class="text-slate-500 mb-8 text-sm font-medium">단어 40개를 모두 학습했어요.<br>이제 완벽하게 기억하시나요?</p>
                <button onclick="location.reload()" class="w-full py-4 bg-gradient-to-r from-pink-400 to-pink-500 text-white rounded-2xl font-black shadow-lg transform active:scale-95 transition text-sm">처음부터 다시 🍭</button>
            </div>
        </div>
        
        <footer class="mt-8 text-center text-white/60 text-[10px] font-bold uppercase tracking-widest">
            Level 10 Vocabulary Master
        </footer>
    </div>

            { id: 36, word: "detect", pron: "디텍트", pos: "v", meaning: "탐지하다", phrase: "detect a leak", def: "to notice or discover something", defKor: "무언가를 알아차리거나 발견하다", syn: "spot" },
            { id: 37, word: "sanitation", pron: "새니테이션", pos: "n", meaning: "위생 설비", phrase: "modern sanitation", def: "systems that keep places clean by removing waste", defKor: "폐기물을 제거하여 장소를 깨끗하게 유지하는 시스템", syn: "" },
            { id: 38, word: "healthcare", pron: "헬스케어", pos: "n", meaning: "의료", phrase: "healthcare system", def: "the services that take care of people's health", defKor: "사람들의 건강을 돌보는 서비스", syn: "" },
            { id: 39, word: "unauthorized", pron: "언오서라이즈드", pos: "a", meaning: "무허가의", phrase: "unauthorized access", def: "without official permission", defKor: "공식적인 허가 없는", syn: "" },
            { id: 40, word: "adequate", pron: "애디퀴트", pos: "a", meaning: "충분한", phrase: "adequate resources", def: "enough in quantity or good enough in quality", defKor: "양이 충분하거나 질이 충분히 좋은", syn: "sufficient" }
        ];

        let currentIndex = 0; 
        let currentMode = 'study';
        let quizQueue = []; 
        let flipCount = 0;
        let isProcessing = false;
        let currentTypedAnswer = "";
        let selectedTileElements = [];

        function showMode(mode) {
            currentMode = mode;
            document.getElementById('study-mode').classList.add('hidden');
            document.getElementById('quiz-mode').classList.add('hidden');
            document.getElementById('choice-mode').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');

            const btnStudy = document.getElementById('btn-study');
            const btnQuiz = document.getElementById('btn-quiz');
            const btnChoice = document.getElementById('btn-choice');

            [btnStudy, btnQuiz, btnChoice].forEach(b => b.className = "nav-btn flex-1 px-3 py-2.5 rounded-2xl text-pink-600 font-bold text-sm");
            
            if (mode === 'study') {
                btnStudy.className = "nav-btn flex-1 px-3 py-2.5 rounded-2xl bg-white text-pink-500 font-bold text-sm shadow-sm";
                document.getElementById('study-mode').classList.remove('hidden');
                renderStudyCard();
            } else if (mode === 'quiz') {
                btnQuiz.className = "nav-btn flex-1 px-3 py-2.5 rounded-2xl bg-white text-pink-500 font-bold text-sm shadow-sm";
                document.getElementById('quiz-mode').classList.remove('hidden');
                startSpellingQuiz();
            } else if (mode === 'choice') {
                btnChoice.className = "nav-btn flex-1 px-3 py-2.5 rounded-2xl bg-white text-pink-500 font-bold text-sm shadow-sm";
                document.getElementById('choice-mode').classList.remove('hidden');
                startChoiceQuiz();
            }
        }

        function updateProgress(current, total) {
            const percent = Math.round((current / total) * 100);
            document.getElementById('progress-text').innerText = `${current} / ${total}`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        /* --- Study Logic --- */
        function renderStudyCard() {
            flipCount = 0;
            const word = wordsData[currentIndex];
            document.getElementById('card-word').innerText = word.word;
            document.getElementById('card-pron').innerText = `[${word.pron}]`;
            document.getElementById('card-pos').innerText = word.pos.toUpperCase();
            document.getElementById('card-phrase').innerText = `"${word.phrase}"`;
            document.getElementById('card-meaning').innerText = word.meaning;
            document.getElementById('card-def').innerText = word.def;
            document.getElementById('card-def-kor').innerText = `(${word.defKor})`;
            document.getElementById('card-syn').innerText = word.syn ? `유의어: ${word.syn}` : "유의어 없음";
            document.getElementById('main-card').classList.remove('is-flipped');
            updateProgress(currentIndex + 1, wordsData.length);
        }

        function flipCard() {
            document.getElementById('main-card').classList.toggle('is-flipped');
            flipCount++;
            if (flipCount >= 6) { setTimeout(nextWord, 400); }
        }

        function nextWord() {
            if (currentIndex < wordsData.length - 1) { currentIndex++; renderStudyCard(); }
            else { showFinalResult(); }
        }

        function prevWord() {
            if (currentIndex > 0) { currentIndex--; renderStudyCard(); }
        }

        /* --- Spelling Quiz Logic --- */
        function startSpellingQuiz() {
            quizQueue = [...wordsData].sort(() => Math.random() - 0.5);
            renderNextSpelling();
        }

        function renderNextSpelling() {
            if (quizQueue.length === 0) { showFinalResult(); return; }
            isProcessing = false;
            const current = quizQueue[0];
            currentTypedAnswer = "";
            selectedTileElements = [];
            updateProgress(wordsData.length - quizQueue.length + 1, wordsData.length);

            document.getElementById('correct-overlay').classList.add('hidden');
            document.getElementById('quiz-question').innerText = current.meaning;
            document.getElementById('quiz-feedback').innerText = "";

            const display = document.getElementById('answer-display');
            display.innerHTML = '';
            for (let i = 0; i < current.word.length; i++) {
                const s = document.createElement('div');
                s.className = "answer-slot";
                s.id = `slot-${i}`;
                display.appendChild(s);
            }

            const pool = document.getElementById('letter-pool');
            pool.innerHTML = '';
            current.word.split('').sort(() => Math.random() - 0.5).forEach(c => {
                const t = document.createElement('div');
                t.className = "letter-tile shadow-sm";
                t.innerText = c;
                t.onclick = () => {
                    if (isProcessing || currentTypedAnswer.length >= current.word.length) return;
                    t.classList.add('used');
                    selectedTileElements.push(t);
                    document.getElementById(`slot-${currentTypedAnswer.length}`).innerText = c;
                    currentTypedAnswer += c;
                    if (currentTypedAnswer.length === current.word.length) checkSpelling();
                };
                pool.appendChild(t);
            });
        }

        function checkSpelling() {
            isProcessing = true;
            const current = quizQueue[0];
            if (currentTypedAnswer === current.word) {
                document.querySelectorAll('.answer-slot').forEach(s => s.classList.add('text-green-500'));
                document.getElementById('reveal-word').innerText = current.word;
                document.getElementById('reveal-meaning').innerText = current.meaning;
                document.getElementById('reveal-def').innerText = current.def;
                document.getElementById('reveal-def-kor').innerText = current.defKor;
                setTimeout(() => document.getElementById('correct-overlay').classList.remove('hidden'), 300);
                quizQueue.shift();
                setTimeout(renderNextSpelling, 2200);
            } else {
                document.getElementById('quiz-feedback').innerText = "오잉? 다시 해볼까요? 🍭";
                document.getElementById('quiz-feedback').className = "mt-4 text-center font-black text-[11px] text-red-400 h-4";
                document.querySelector('.bubble-container').classList.add('shake');
                setTimeout(() => {
                    document.querySelector('.bubble-container').classList.remove('shake');
                    clearCurrentAnswer();
                    isProcessing = false;
                }, 600);
            }
        }

        function backspace() {
            if (isProcessing || currentTypedAnswer.length === 0) return;
            const lastIdx = currentTypedAnswer.length - 1;
            document.getElementById(`slot-${lastIdx}`).innerText = "";
            const t = selectedTileElements.pop();
            t.classList.remove('used');
            currentTypedAnswer = currentTypedAnswer.slice(0, -1);
        }

        function clearCurrentAnswer() {
            if (isProcessing) return;
            currentTypedAnswer = "";
            selectedTileElements = [];
            document.querySelectorAll('.answer-slot').forEach(s => s.innerText = "");
            document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('used'));
        }

        /* --- Choice Quiz Logic --- */
        function startChoiceQuiz() {
            quizQueue = [...wordsData].sort(() => Math.random() - 0.5);
            renderNextChoice();
        }

        function renderNextChoice() {
            if (quizQueue.length === 0) { showFinalResult(); return; }
            isProcessing = false;
            const current = quizQueue[0];
            updateProgress(wordsData.length - quizQueue.length + 1, wordsData.length);

            document.getElementById('choice-question-word').innerText = current.word;
            document.getElementById('choice-question-pron').innerText = `[${current.pron}]`;
            document.getElementById('choice-feedback').innerText = "";

            const grid = document.getElementById('choices-grid');
            grid.innerHTML = '';

            let options = [current.meaning];
            const others = wordsData.filter(w => w.meaning !== current.meaning);
            const distractors = others.sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.meaning);
            options = [...options, ...distractors].sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.innerText = opt;
                btn.onclick = () => handleChoice(opt, btn, current.meaning);
                grid.appendChild(btn);
            });
        }

        function handleChoice(selected, btn, correct) {
            if (isProcessing) return;
            isProcessing = true;

            if (selected === correct) {
                btn.classList.add('correct');
                document.getElementById('choice-feedback').innerText = "빙고! 정답이에요! ✨";
                document.getElementById('choice-feedback').className = "text-center font-black text-[11px] text-green-500 h-4";
                quizQueue.shift();
                setTimeout(renderNextChoice, 1200);
            } else {
                btn.classList.add('wrong');
                document.getElementById('choice-feedback').innerText = "아쉬워요, 다시 도전! 🍬";
                document.getElementById('choice-feedback').className = "text-center font-black text-[11px] text-red-400 h-4";
                const item = quizQueue.shift();
                quizQueue.push(item); 
                setTimeout(renderNextChoice, 1200);
            }
        }

        function showFinalResult() {
            document.getElementById('study-mode').classList.add('hidden');
            document.getElementById('quiz-mode').classList.add('hidden');
            document.getElementById('choice-mode').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            updateProgress(wordsData.length, wordsData.length);
        }

        window.onload = () => renderStudyCard();
    </script>
</body>
</html>
